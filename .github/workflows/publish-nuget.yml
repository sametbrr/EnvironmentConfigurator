# Release: NuGet package on a <Version> bump in EnvironmentConfigurator.csproj (master only).
# The tag v<version> is created if missing; an existing tag means "already released", nothing runs.
# Then: test, pack, push to nuget.org, tag, GitHub release (notes from commit subjects, via a file).
# Auth: nuget.org trusted publishing (OIDC). Policy: owner sametbrr, repo EnvironmentConfigurator,
# workflow publish-nuget.yml, environment nuget. No API key is stored.
name: Publish NuGet on Version Bump

on:
  push:
    branches: [master]
    paths:
      - EnvironmentConfigurator/EnvironmentConfigurator.csproj
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write   # OIDC token for nuget.org trusted publishing

env:
  PROJECT: EnvironmentConfigurator/EnvironmentConfigurator.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check ref
        env:
          DEFAULT_BRANCH: master
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::releases run only from $DEFAULT_BRANCH (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"; exit 1
          fi

      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(sed -n 's:.*<Version>[[:space:]]*\([^<[:space:]]*\)[[:space:]]*</Version>.*:\1:p' "$PROJECT" | head -1)
          if [ -z "$VERSION" ]; then echo "::error::no <Version> in $PROJECT"; exit 1; fi
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Detected version: $TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.release == 'true'
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Run tests
        if: steps.version.outputs.release == 'true'
        run: dotnet test EnvironmentConfigurator.sln -c Release

      - name: Pack
        if: steps.version.outputs.release == 'true'
        run: dotnet pack "$PROJECT" -c Release -o ./artifacts

      - name: NuGet login (OIDC)
        if: steps.version.outputs.release == 'true'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: sametbrr

      - name: Push to NuGet
        if: steps.version.outputs.release == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "::error::NuGet login returned no API key (check the trusted publishing policy)"; exit 1; fi
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Write release notes
        if: steps.version.outputs.release == 'true'
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --pretty='- %s' "${PREV_TAG}..HEAD" > "$NOTES"
          else
            git log --pretty='- %s' -20 > "$NOTES"
          fi

      - name: Create tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" ./artifacts/*.nupkg \
            --title "EnvironmentConfigurator $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
